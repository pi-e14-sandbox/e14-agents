openapi: 3.0.3
info:
  title: orders-service
  version: 1.0.0
paths:
  /api/orders:
    get:
      operationId: listOrders
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Order" } }
    post:
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewOrder" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
  /api/orders/{id}:
    get:
      operationId: getOrder
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
  /api/customers/{id}:
    get:
      operationId: getCustomer
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: ok
components:
  schemas:
    NewOrder:
      type: object
      required: [customerId, totalCents]
      properties:
        customerId: { type: string }
        totalCents: { type: integer }
    Order:
      type: object
      required: [id, customerId, totalCents]
      properties:
        id: { type: string }
        customerId: { type: string }
        totalCents: { type: integer }
